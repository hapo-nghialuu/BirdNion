name: linux-build

# Builds the Tauri Linux port on real Ubuntu: cargo tests + .deb/.rpm/AppImage
# bundles as artifacts. This is the ground-truth check that the port actually
# compiles and links against webkit2gtk/appindicator on the target platform.
#
# Temporarily manual-only: automatic Linux builds are disabled until the
# Linux packaging lane is re-enabled.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: linux/src-tauri

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json khai báo resource `binaries/cliproxyapi`, nhưng thư mục
      # đó bị gitignore và helper build từ một repo Go riêng, nên CI không có
      # cách nào lấy bản thật. Không có file này thì build.rs fail và cả job
      # dừng trước khi chạy được test (CI hỏng từ 2026-07-21).
      # Job này CHỈ để verify compile/test/bundle — bundle sinh ra ở đây không
      # dùng để phát hành. Bản phát hành đi qua `linux-release.yml`, workflow
      # đó tải helper thật kèm checksum.
      - name: Stub bundled CLIProxyAPI helper (verification build only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\necho "BirdNion CI stub - not a real CLIProxyAPI helper" >&2\nexit 1\n' \
            > src-tauri/binaries/cliproxyapi
          chmod 755 src-tauri/binaries/cliproxyapi

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build bundles (.deb / .rpm / AppImage)
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: birdnion-linux-bundles-verification-only
          path: |
            linux/src-tauri/target/release/bundle/deb/*.deb
            linux/src-tauri/target/release/bundle/rpm/*.rpm
            linux/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
